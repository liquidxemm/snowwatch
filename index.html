<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snowwatch</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: header + tabs, then either the watched-cam grid with a season log, or the full cam catalog */
:root {
  --bg: #eef2f5; --panel: #ffffff; --fg: #17222c; --muted: #5d6c78; --line: #d3dbe2;
  --ice: #2f6f9f; --snow: #1d84d6; --warn: #b76e00;
  --display: "Archivo Narrow", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e151b; --panel: #16212a; --fg: #e3eaf0; --muted: #8a9aa7; --line: #263541;
          --ice: #8cc4ec; --snow: #4aa8f5; --warn: #f0a83c; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body);
       padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 14px; }
h1 { font: 700 34px/1 var(--display); letter-spacing: .01em; margin: 0; }
h1 small { display: block; font: 400 13px var(--body); color: var(--muted); margin-top: 6px; letter-spacing: 0; }
h2.section { font: 700 20px var(--display); margin: 28px 0 10px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, .btn { font: 500 13px var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line);
         border-radius: 6px; padding: 7px 12px; cursor: pointer; text-decoration: none; }
button:hover, .btn:hover { border-color: var(--ice); }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--snow); outline-offset: 2px; }
button.on { background: var(--snow); border-color: var(--snow); color: #fff; }
.status { font: 12px var(--mono); color: var(--muted); }
.tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 12px; font: 700 15px var(--display); color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--snow); }
#banner { margin-bottom: 14px; padding: 12px 14px; border-radius: 8px; background: var(--snow); color: #fff; font-weight: 500; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
.card.snowing { border-color: var(--snow); box-shadow: 0 0 0 2px var(--snow); }
.shot { position: relative; aspect-ratio: 16/9; background: var(--line); display: block; max-width: 100%; }
.shot.linkonly { aspect-ratio: auto; height: 64px; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.noimg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; padding: 12px; }
.pill { position: absolute; bottom: 10px; left: 10px; font: 700 12px var(--display); letter-spacing: .06em; text-transform: uppercase;
        padding: 4px 9px; border-radius: 99px; background: rgba(0,0,0,.6); color: #fff; }
.pill.snow { background: var(--snow); }
.pill.soon { background: var(--warn); }
.cbody { padding: 12px 14px 14px; display: grid; gap: 10px; }
.title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.title h3 { font: 700 19px/1.1 var(--display); margin: 0; }
.title a { color: var(--ice); font-size: 12px; white-space: nowrap; }
.meta { font: 12px var(--mono); color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; font-variant-numeric: tabular-nums; }
.stats b { display: block; font: 500 16px var(--mono); }
.stats span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.spark { width: 100%; height: 44px; display: block; }
.sparklabel { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--muted); }
.unwatch { background: none; border: 0; padding: 0; color: var(--muted); font-size: 12px; text-decoration: underline; justify-self: start; }
.log { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px 14px; }
.log div { display: grid; grid-template-columns: 9.5em 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.log div:last-child { border-bottom: 0; }
.log time { font: 12px var(--mono); color: var(--muted); }
.log .first { color: var(--snow); font-weight: 500; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filters input, .filters select { font: 13px var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
.filters input[type=search] { flex: 1 1 220px; min-width: 0; }
.catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 10px; }
.row { display: grid; grid-template-columns: 96px 1fr; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-width: 0; }
.row .thumb { width: 96px; height: 60px; border-radius: 4px; background: var(--line); object-fit: cover; display: block; }
.row .info { min-width: 0; display: grid; gap: 4px; align-content: start; }
.row b { font: 700 15px/1.15 var(--display); overflow-wrap: anywhere; }
.row button { justify-self: start; padding: 3px 9px; font-size: 12px; }
.note { font-size: 12px; color: var(--muted); max-width: 70ch; }
.note a { color: var(--ice); }
@media (prefers-reduced-motion: no-preference) { .card.snowing .pill.snow { animation: pulse 1.6s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .55; } }
</style>
</head>
<body>
<header>
  <h1>Snowwatch<small id="sub">Alpine cams in one place · alerts when snow starts</small></h1>
  <div class="controls">
    <span class="status" id="status">loading…</span>
    <button id="btnRefresh">Refresh</button>
    <button id="btnNotify">Enable alerts on this device</button>
  </div>
</header>
<div id="banner" hidden></div>
<nav class="tabs" role="tablist">
  <button role="tab" id="tabWatch" aria-selected="true">Watching</button>
  <button role="tab" id="tabAll" aria-selected="false">All cams</button>
</nav>

<section id="viewWatch">
  <main class="grid" id="grid"></main>
  <h2 class="section">Season log</h2>
  <div class="log" id="log"></div>
  <p class="note">The log and phone pushes come from the check that runs on GitHub every 15 minutes, for the cams in
    <a id="wlLink" href="#">watchlist.json</a>. Cams you add or remove here only change this browser's view.
    <button id="btnCopyWl" class="unwatch">Copy this view as watchlist.json</button></p>
</section>

<section id="viewAll" hidden>
  <div class="filters">
    <input type="search" id="q" placeholder="Search name, valley, glacier…" aria-label="Search cams">
    <select id="country" aria-label="Country"><option value="">All countries</option></select>
    <select id="minElev" aria-label="Minimum altitude">
      <option value="0">Any altitude</option><option value="1500">≥ 1500 m</option><option value="2000">≥ 2000 m</option>
      <option value="2500" selected>≥ 2500 m</option><option value="3000">≥ 3000 m</option>
    </select>
  </div>
  <p class="note" id="catCount"></p>
  <div class="catalog" id="catalog"></div>
</section>

<script type="module">
import { fetchWeather, analyse, step, describe, CODE_TEXT } from "./snow.js";

const REPO = "liquidxemm/snowwatch";
const WEATHER_EVERY = 10 * 60e3, IMAGE_EVERY = 5 * 60e3;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f1 = v => (v == null || Number.isNaN(v) ? "–" : v.toFixed(1));
const store = {
  get(k, d) { try { const v = localStorage.getItem("snowwatch:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("snowwatch:" + k, JSON.stringify(v)); } catch {} },
};

let catalog = [], repoWatch = [], analyses = store.get("analyses", {}), local = store.get("state", {});
let added = new Set(store.get("added", [])), removed = new Set(store.get("removed", []));
const byId = id => catalog.find(c => c.id === id);
const watched = () => [...repoWatch.filter(id => !removed.has(id)), ...[...added].filter(id => !repoWatch.includes(id))].map(byId).filter(Boolean);
const saveLocal = () => { store.set("added", [...added]); store.set("removed", [...removed]); };

const thumbOf = c => c.img.includes("foto-webcam.eu") ? c.img.replace("/816.jpg", "/400.jpg") : c.img.replace(/\/medium$/, "/thumbnail");
const bust = url => url + (url.includes("?") ? "&" : "?") + "t=" + Math.floor(Date.now() / IMAGE_EVERY);
const imgFail = "this.replaceWith(Object.assign(document.createElement('div'),{className:'noimg',textContent:'Snapshot not available right now. Open the live page.'}))";

function statusOf(c) {
  const a = analyses[c.id];
  if (!a) return "none";
  return a.snowingNow ? "snow" : a.next3 >= 0.5 ? "soon" : "dry";
}

function spark(a) {
  const W = 300, H = 44, n = a.series.length, max = Math.max(0.5, ...a.series), bw = W / n;
  let bars = "";
  a.series.forEach((v, i) => {
    const bh = (v / max) * (H - 4);
    if (bh > 0) bars += `<rect x="${(i * bw).toFixed(1)}" y="${(H - bh).toFixed(1)}" width="${(bw - 1).toFixed(1)}" height="${bh.toFixed(1)}" fill="${i <= a.idxNow ? "var(--snow)" : "var(--ice)"}" opacity="${i <= a.idxNow ? 1 : .45}"/>`;
  });
  const nx = ((a.idxNow + 1) * bw).toFixed(1);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Hourly snowfall, past 24 h and next 24 h">
    <line x1="0" y1="${H - .5}" x2="${W}" y2="${H - .5}" stroke="var(--line)"/>${bars}
    <line x1="${nx}" y1="0" x2="${nx}" y2="${H}" stroke="var(--muted)" stroke-dasharray="2 2"/></svg>`;
}

function card(c) {
  const a = analyses[c.id], st = statusOf(c);
  const pill = st === "snow" ? "Snowing" : st === "soon" ? "Snow within 3 h" : a ? (CODE_TEXT[a.code] || "–") : "…";
  const img = c.img ? `<img src="${esc(bust(c.img))}" alt="Latest view from ${esc(c.name)}" loading="lazy" onerror="${imgFail}">`
                    : `<div class="noimg" style="place-items:center end;padding-right:14px">360° viewer, open live page ↗</div>`;
  return `<article class="card ${st === "snow" ? "snowing" : ""}">
    <a class="shot${c.img ? "" : " linkonly"}" href="${esc(c.page)}" target="_blank" rel="noopener">${img}<span class="pill ${st}">${pill}</span></a>
    <div class="cbody">
      <div class="title"><h3>${esc(c.name)}</h3><a href="${esc(c.page)}" target="_blank" rel="noopener">Live ↗</a></div>
      <div class="meta">${c.elev} m · ${c.country.toUpperCase()}${a && a.freezingLevel != null ? ` · 0 °C line ${Math.round(a.freezingLevel)} m` : ""}</div>
      ${a ? `<div class="stats">
        <div><b>${f1(a.temp)}°</b><span>temp</span></div>
        <div><b>${f1(a.snowRate)}</b><span>cm now</span></div>
        <div><b>${f1(a.past24)}</b><span>cm 24 h</span></div>
        <div><b>${f1(a.next24)}</b><span>cm next 24 h</span></div></div>
        ${spark(a)}<div class="sparklabel"><span>−24 h</span><span>now</span><span>+24 h</span></div>` : ""}
      <button class="unwatch" data-unwatch="${esc(c.id)}">Stop watching</button>
    </div></article>`;
}

function renderWatch() {
  const order = { snow: 0, soon: 1, dry: 2, none: 3 };
  const list = watched().sort((x, y) => order[statusOf(x)] - order[statusOf(y)] || !x.img - !y.img || y.elev - x.elev);
  $("grid").innerHTML = list.length ? list.map(card).join("") : `<p class="note">You aren't watching any cams. Add some under All cams.</p>`;
  const n = list.filter(c => statusOf(c) === "snow").length;
  $("sub").textContent = n ? `Snowing now at ${n} of ${list.length} watched cams` : `${list.length} watched cams · no snow falling right now`;
}

function renderCatalog() {
  const q = $("q").value.trim().toLowerCase(), cc = $("country").value, min = +$("minElev").value;
  const ids = new Set(watched().map(c => c.id));
  const hits = catalog.filter(c => c.elev >= min && (!cc || c.country === cc) && (!q || (c.name + " " + c.title + " " + c.id).toLowerCase().includes(q)));
  $("catCount").textContent = `${hits.length} of ${catalog.length} cams`;
  $("catalog").innerHTML = hits.slice(0, 200).map(c => `<div class="row">
      <a href="${esc(c.page)}" target="_blank" rel="noopener">${c.img ? `<img class="thumb" src="${esc(thumbOf(c))}" alt="" loading="lazy">` : `<div class="thumb"></div>`}</a>
      <div class="info"><b>${esc(c.name)}</b><span class="meta">${c.elev} m · ${c.country.toUpperCase()}</span>
        <button data-toggle="${esc(c.id)}" class="${ids.has(c.id) ? "on" : ""}">${ids.has(c.id) ? "Watching" : "Watch"}</button></div></div>`).join("");
}

async function renderLog() {
  try {
    const r = await fetch("data/log.json", { cache: "no-store" });
    const log = r.ok ? await r.json() : [];
    $("log").innerHTML = log.length ? log.slice().reverse().slice(0, 60).map(e => `<div>
        <time>${new Date(e.t).toLocaleString([], { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })}</time>
        <span class="${e.type === "first" ? "first" : ""}"><b>${esc(e.name)}</b>: ${e.type === "first" ? "first snow of the season. " : e.type === "start" ? "snow started. " : e.type === "stop" ? "snow stopped. " : "snow coming. "}${esc(e.msg)}</span></div>`).join("")
      : `<div><time>–</time><span>No snow events logged yet. The first one appears here as soon as the GitHub check sees snow.</span></div>`;
  } catch { $("log").innerHTML = `<div><time>–</time><span>The log loads when this page is served from GitHub Pages.</span></div>`; }
}

// --- alerts on this device ---
let audioCtx;
function chime() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [880, 1175, 1568].forEach((f, k) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + k * .18;
      o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.25, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .6);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + .65);
    });
  } catch {}
}
function alertUser(title, body) {
  chime();
  $("banner").textContent = `${title} · ${body}`; $("banner").hidden = false;
  try { if (Notification.permission === "granted") new Notification(title, { body }); } catch {}
}

async function refresh() {
  $("status").textContent = "updating…";
  const cams = watched();
  try {
    const ws = await fetchWeather(cams);
    const now = Date.now();
    cams.forEach((c, i) => {
      const a = analyses[c.id] = analyse(ws[i], now);
      const seen = c.id in local; // first time we see a cam: record its state without alerting
      const { state, events } = step(local[c.id], a, now);
      local[c.id] = state;
      if (seen) for (const ev of events) if (ev.type !== "stop") { const d = describe(ev, c, a); alertUser(d.title, d.body); }
    });
    store.set("state", local);
    store.set("analyses", analyses); store.set("analysedAt", now);
    $("status").textContent = `updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
  } catch (e) {
    const at = store.get("analysedAt", 0);
    $("status").textContent = (at ? `showing data from ${new Date(at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}; ` : "") + "weather update failed, retrying in 10 min";
  }
  renderWatch();
  renderLog();
}

// --- wiring ---
function showTab(all) {
  $("tabWatch").setAttribute("aria-selected", !all); $("tabAll").setAttribute("aria-selected", all);
  $("viewWatch").hidden = all; $("viewAll").hidden = !all;
  if (all) renderCatalog(); else refresh();
}
$("tabWatch").onclick = () => showTab(false);
$("tabAll").onclick = () => showTab(true);
$("btnRefresh").onclick = refresh;
$("btnNotify").onclick = async () => {
  chime();
  try { const p = await Notification.requestPermission(); $("btnNotify").textContent = p === "granted" ? "Alerts on" : "Sound alerts on"; }
  catch { $("btnNotify").textContent = "Sound alerts on"; }
  $("btnNotify").classList.add("on");
};
document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle],[data-unwatch]");
  if (!t) return;
  const id = t.dataset.toggle || t.dataset.unwatch;
  const on = watched().some(c => c.id === id);
  if (on) { added.delete(id); if (repoWatch.includes(id)) removed.add(id); }
  else { removed.delete(id); if (!repoWatch.includes(id)) added.add(id); }
  saveLocal();
  if (t.dataset.toggle) renderCatalog(); else renderWatch();
});
["q", "country", "minElev"].forEach(id => $(id).addEventListener("input", renderCatalog));
$("wlLink").href = `https://github.com/${REPO}/edit/main/watchlist.json`;
$("btnCopyWl").onclick = async () => {
  const text = JSON.stringify(watched().map(c => c.id), null, 2);
  try { await navigator.clipboard.writeText(text); $("btnCopyWl").textContent = "Copied. Paste it into watchlist.json on GitHub."; }
  catch { $("btnCopyWl").textContent = text; }
};

try { if (Notification.permission === "granted") { $("btnNotify").textContent = "Alerts on"; $("btnNotify").classList.add("on"); } } catch {}

const [cat, wl] = await Promise.all([fetch("cams.json").then(r => r.json()), fetch("watchlist.json", { cache: "no-store" }).then(r => r.json())]);
catalog = cat.cams; repoWatch = wl;
[...new Set(catalog.map(c => c.country))].sort().forEach(cc => $("country").insertAdjacentHTML("beforeend", `<option value="${cc}">${cc.toUpperCase()}</option>`));
renderWatch();
refresh();
setInterval(refresh, WEATHER_EVERY);
setInterval(renderWatch, IMAGE_EVERY);
</script>
</body>
</html>
