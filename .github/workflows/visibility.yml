name: Visibility and stations

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/visibility.mjs, scripts/stations.mjs]

permissions:
  contents: write

concurrency:
  group: visibility
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund jpeg-js@0.4.4
      - name: Load previous scores
        run: |
          git fetch --depth 1 origin data && git show origin/data:vis.json > prev-vis.json || echo '{"cams":{}}' > prev-vis.json
      - name: Score cam images
        run: node scripts/visibility.mjs prev-vis.json vis.json
      - name: Collect measured snow depth
        run: node scripts/stations.mjs stations.json
      # Scores live on their own branch (one commit, replaced each run) so main stays clean.
      - name: Publish to data branch
        run: |
          mkdir out && cp vis.json stations.json out/ && cd out
          git init -q -b data
          git config user.name "snowwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vis.json stations.json && git commit -qm "Visibility scores and station data"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
